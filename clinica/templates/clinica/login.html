{% extends "clinica/base.html" %}

{% block content %}
<div class="login-wrap">
    <div class="login-logo">Centro Médico UNCP</div>
    <div class="card">
        <h2>Iniciar sesión</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="field">
                <label for="id_username">Usuario</label>
                {{ form.username }}
            </div>
            <div class="field">
                <label for="id_password">Contraseña</label>
                {{ form.password }}
            </div>
            <button type="submit">Ingresar</button>
        </form>
        <p style="margin-top:1rem;color:#52606D;font-size:0.9rem">
            Prueba: <strong>admin / admin123</strong>, <strong>medico1 / medico123</strong>,
            <strong>paciente1 / paciente123</strong>.
        </p>
    </div>
</div>
{% endblock %}
